name: Refresh immersive video loading

on:
  push:
    paths:
      - 'docs/.immersive-video-refresh-trigger'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair immersive visualiser and videos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('installation/index.html')
          s=p.read_text()

          # 1) Fix Three.js compatibility: CapsuleGeometry is unavailable in the r128 core build.
          s=s.replace("new THREE.CapsuleGeometry(.34,1.35,8,20)", "new THREE.CylinderGeometry(.34,.34,2.0,24)")

          # 2) Remove previous src-stripping/lazy-loader script completely.
          s=re.sub(r'\n?<script id=[\"\']?immersiveVideoRefresh[\"\']?>.*?</script>\n?', '\n', s, flags=re.S)

          # 3) Keep every immersive background film address in the DOM and let the browser preload metadata.
          s=re.sub(r'muted(?: autoplay)? loop playsinline preload=\"(?:none|metadata)\"', 'muted autoplay loop playsinline preload="metadata"', s)
          s=re.sub(r'muted autoplay loop playsinline(?! preload)', 'muted autoplay loop playsinline preload="metadata"', s)

          # 4) Add a conservative playback helper: never removes src, just retries play/load.
          js='''\n<script id="immersiveVideoRefresh">\n(function(){\n  var V='20260908-2000';\n  var videos=[].slice.call(document.querySelectorAll('.bg video'));\n  videos.forEach(function(v){\n    var raw=v.getAttribute('src');\n    if(!raw)return;\n    var base=raw.split('?')[0];\n    v.src=base+'?v='+V;\n    v.muted=true; v.playsInline=true; v.loop=true;\n    v.preload='metadata';\n    v.load();\n    var p=v.play(); if(p&&p.catch)p.catch(function(){});\n    v.addEventListener('error',function(){\n      if(v.dataset.retry)return;\n      v.dataset.retry='1';\n      v.src=base+'?retry='+Date.now();\n      v.load();\n      var q=v.play(); if(q&&q.catch)q.catch(function(){});\n    });\n  });\n  document.addEventListener('visibilitychange',function(){\n    if(document.hidden)return;\n    videos.forEach(function(v){var p=v.play(); if(p&&p.catch)p.catch(function(){});});\n  });\n})();\n</script>\n'''
          s=s.replace('</body>', js+'\n</body>')
          p.write_text(s)
          PY
          git config user.name "ChatGPT Site Update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installation/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix immersive visualiser and background videos"
            git push
          fi