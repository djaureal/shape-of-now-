name: Publish V3 to main site
on:
  push:
    paths:
      - '.github/workflows/publish-v3-to-main-trigger'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Promote V3 to production paths
        run: |
          set -euo pipefail
          cp V3/index.html index.html
          cp V3/stage/index.html stage/index.html
          cp V3/installation/index.html installation/index.html

          sed -i 's#\.\./media/#media/#g' index.html
          sed -i 's#\.\./\.\./media/#../media/#g' stage/index.html
          sed -i 's#\.\./\.\./media/#../media/#g' installation/index.html

          if grep -q '\.\./media/' index.html; then
            echo 'Unexpected ../media path remains in production root' >&2
            exit 1
          fi
          if grep -q '\.\./\.\./media/' stage/index.html installation/index.html; then
            echo 'Unexpected ../../media path remains in production route' >&2
            exit 1
          fi
          grep -q '<html' index.html
          grep -q '<html' stage/index.html
          grep -q '<html' installation/index.html

          git config user.name 'ChatGPT Site Update'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html stage/index.html installation/index.html
          git commit -m 'Publish V3 as main Construct of Time site'
          git push
