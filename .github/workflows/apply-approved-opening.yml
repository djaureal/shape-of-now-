name: Apply approved opening
on:
  push:
    paths:
      - '.github/workflows/apply-approved-opening-trigger'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved homepage opening
        run: python3 scripts/apply_approved_opening.py
      - name: Commit changes
        run: |
          git config user.name 'ChatGPT Site Update'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V3/index.html index.html
          git commit -m 'Apply approved homepage opening'
          git push
