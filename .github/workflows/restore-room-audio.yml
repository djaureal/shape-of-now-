name: Restore room audio
on:
  push:
    paths:
      - '.github/workflows/restore-room-audio-trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject room audio
        run: python3 scripts/inject_room_audio.py
      - name: Validate
        run: |
          grep -q '../../media/room-audio.js' V3/installation/index.html
          grep -q '../media/room-audio.js' installation/index.html
      - name: Commit changes
        run: |
          git config user.name 'ChatGPT Site Update'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V3/installation/index.html installation/index.html
          git diff --cached --quiet || git commit -m 'Restore 3D visualiser audio'
          git push
