name: Mount original website at V2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mount-original-v2.yml'
permissions:
  contents: write
jobs:
  mount:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Export protected original backup into V2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf V2
          mkdir V2
          git archive 63cf874989e724deb465d549b8b33632b3601332 | tar -x -C V2
          rm -rf V2/.github V2/V2
          # Keep this as a frozen comparison snapshot. The protected backup branch itself is never changed.
          git add V2
          if git diff --cached --quiet; then
            echo 'V2 already matches protected backup.'
            exit 0
          fi
          git config user.name 'ChatGPT Site Update'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Mount protected original website snapshot at V2'
          git push origin main