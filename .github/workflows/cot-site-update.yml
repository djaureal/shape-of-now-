name: Deploy final Construct of Time site

on:
  push:
    paths:
      - '.github/workflows/cot-site-update.yml'

permissions:
  contents: write

jobs:
  deploy-final-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore final site
        shell: bash
        run: |
          set -euo pipefail
          cat deploy/cot-index.part* | base64 -d | gzip -dc > index.html
          mkdir -p media/stage
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

          curl -fL --retry 3 -o /tmp/stage01.mp4 'https://d8j0ntlcm91z4.cloudfront.net/user_3DwFIbiz6zkSYGJkFtQ3nlc5Uqo/hf_20260828_123540_7ab088c1-269d-4b13-8a41-5f9bb0119d3d.mp4'
          curl -fL --retry 3 -o /tmp/stage02.mp4 'https://d8j0ntlcm91z4.cloudfront.net/user_3DwFIbiz6zkSYGJkFtQ3nlc5Uqo/hf_20260828_123540_4b5b88ed-9b1c-4fec-a9d9-a63f2dc41c3a.mp4'
          curl -fL --retry 3 -o /tmp/stage03.mp4 'https://d8j0ntlcm91z4.cloudfront.net/user_3DwFIbiz6zkSYGJkFtQ3nlc5Uqo/hf_20260828_125257_d58181e1-5e3b-48b3-8b2b-b0627b2a845c.mp4'

          ffmpeg -hide_banner -loglevel error -y -ss 2 -i /tmp/stage01.mp4 -frames:v 1 -vf 'scale=1920:-2' -q:v 3 media/stage/stage-01.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 4 -i /tmp/stage02.mp4 -frames:v 1 -vf 'scale=1920:-2' -q:v 3 media/stage/stage-02.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 3 -i /tmp/stage03.mp4 -frames:v 1 -vf 'scale=1920:-2' -q:v 3 media/stage/stage-03.jpg

          test -s index.html
          grep -q 'Construct of Time' index.html
          grep -q 'id="stage-design"' index.html
          grep -q 'id="room"' index.html
          grep -q '8ec6a63d-b6c9-4542-b754-30e42b4a6d06.mp4' index.html
          grep -q 'media/stage/stage-01.jpg' index.html

          git config user.name 'ChatGPT Site Update'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html media/stage/
          git commit -m 'Restore final COT site with LIVE demo and IMMERSIVE 3D room'
          git push
