name: Deploy COT film fragments

on:
  issues:
    types:
      - opened

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update film fragment players
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          s = s.replace('<div class="fmeta"><span class="fn">Study I</span><span class="ft">Measurement / Field</span><span class="fd">motion study</span></div>\n        <div class="fwrap"><video src="media/video/c1.mp4" muted loop playsinline preload="metadata" controls></video></div>\n        <figcaption class="fcap">radial systems · measurement · <b>the architecture of division</b></figcaption>', '<div class="fmeta"><span class="fn">Film I</span><span class="ft">We Measure</span><span class="fd">film fragment</span></div>\n        <div class="fwrap"><video class="film-hls" data-hls="media/video/hls/we_measure/index.m3u8" poster="media/video/hls/we_measure/poster.jpg" playsinline preload="metadata" controls></video></div>\n        <figcaption class="fcap">measurement · perception · <b>the architecture of division</b></figcaption>')
          s = s.replace('<div class="fmeta"><span class="fn">Study II</span><span class="ft">The Witness</span><span class="fd">motion study</span></div>\n        <div class="fwrap"><video src="media/video/a1.mp4" muted loop playsinline preload="metadata" controls></video></div>\n        <figcaption class="fcap">luminous figure · brutalist void · <b>presence without biography</b></figcaption>', '<div class="fmeta"><span class="fn">Film II</span><span class="ft">You&rsquo;re the Wave</span><span class="fd">film fragment</span></div>\n        <div class="fwrap"><video class="film-hls" data-hls="media/video/hls/youre_the_wave/index.m3u8" poster="media/video/hls/youre_the_wave/poster.jpg" playsinline preload="metadata" controls></video></div>\n        <figcaption class="fcap">identity · interference · <b>the self as wave, not point</b></figcaption>')
          s = s.replace('<div class="fmeta"><span class="fn">Study III</span><span class="ft">Threshold</span><span class="fd">motion study</span></div>\n        <div class="fwrap"><video src="media/video/c2.mp4" muted loop playsinline preload="metadata" controls></video></div>\n        <figcaption class="fcap">stillness · scale · <b>the figure inside the field</b></figcaption>', '<div class="fmeta"><span class="fn">Film III</span><span class="ft">Beyond the End</span><span class="fd">film fragment</span></div>\n        <div class="fwrap"><video class="film-hls" data-hls="media/video/hls/beyond_the_end/index.m3u8" poster="media/video/hls/beyond_the_end/poster.jpg" playsinline preload="metadata" controls></video></div>\n        <figcaption class="fcap">threshold · collapse · <b>beyond the measured edge</b></figcaption>')

          if 'id="filmHlsInit"' not in s:
              hls_script = '\n<script src="media/lib/hls.min.js"></script>\n<script id="filmHlsInit">\n(function(){\n  document.querySelectorAll(\'video.film-hls[data-hls]\').forEach(function(video){\n    var src = video.dataset.hls;\n    if (video.canPlayType(\'application/vnd.apple.mpegurl\')) {\n      video.src = src;\n    } else if (window.Hls && Hls.isSupported()) {\n      var hls = new Hls({enableWorker:true, lowLatencyMode:false});\n      hls.loadSource(src);\n      hls.attachMedia(video);\n    }\n  });\n})();\n</script>\n'
              s = s.replace('</body>', hls_script + '</body>')

          p.write_text(s)
          PY

          git config user.name "ChatGPT Site Update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Restore self-hosted COT film fragments"
            git push
          fi
