name: Fix final Construct of Time stage stills

on:
  push:
    paths:
      - '.github/workflows/cot-site-update.yml'

permissions:
  contents: write

jobs:
  fix-stage-stills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace missing local stills with frozen stage frames
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          s=s.replace(' poster="media/stage/stage-01.jpg"','')

          s=s.replace('<img src="media/stage/stage-01.jpg" alt="Construct of Time live stage — central portal, rear screen architecture and three performers" loading="lazy">', '<video class="stage-still" muted playsinline preload="metadata" data-still-time="2.1"><source src="https://d8j0ntlcm91z4.cloudfront.net/user_3DwFIbiz6zkSYGJkFtQ3nlc5Uqo/hf_20260828_123540_7ab088c1-269d-4b13-8a41-5f9bb0119d3d.mp4" type="video/mp4"></video>')
          s=s.replace('<img src="media/stage/stage-02.jpg" alt="Construct of Time live stage — wide monochrome audience view" loading="lazy">', '<video class="stage-still" muted playsinline preload="metadata" data-still-time="4.6"><source src="https://d8j0ntlcm91z4.cloudfront.net/user_3DwFIbiz6zkSYGJkFtQ3nlc5Uqo/hf_20260828_123540_4b5b88ed-9b1c-4fec-a9d9-a63f2dc41c3a.mp4" type="video/mp4"></video>')
          s=s.replace('<img src="media/stage/stage-03.jpg" alt="Construct of Time live stage — luminous figure and eclipse visual across the rear screen array" loading="lazy">', '<video class="stage-still" muted playsinline preload="metadata" data-still-time="6.8"><source src="https://d8j0ntlcm91z4.cloudfront.net/user_3DwFIbiz6zkSYGJkFtQ3nlc5Uqo/hf_20260828_125257_d58181e1-5e3b-48b3-8b2b-b0627b2a845c.mp4" type="video/mp4"></video>')

          freeze='''\n<script id="stageStillFreeze">\n(function(){\n  document.querySelectorAll('video.stage-still').forEach(function(v){\n    function freeze(){\n      var t=parseFloat(v.dataset.stillTime||'1');\n      try{ if(Number.isFinite(t) && v.duration) v.currentTime=Math.min(t, Math.max(.1,v.duration-.15)); }catch(e){}\n    }\n    v.addEventListener('loadedmetadata', freeze, {once:true});\n    v.addEventListener('seeked', function(){ v.pause(); });\n    v.pause();\n  });\n})();\n</script>\n'''
          if 'id="stageStillFreeze"' not in s:
              s=s.replace('</body>', freeze+'\n</body>')

          p.write_text(s)
          PY

          git config user.name "ChatGPT Site Update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix stage stills in final COT website"
            git push
          fi
