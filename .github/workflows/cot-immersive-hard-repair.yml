name: Hard repair immersive page

on:
  push:
    paths:
      - 'docs/.immersive-hard-repair-trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-host immersive videos and repair visualiser
        run: |
          set -e
          mkdir -p media/installation
          base='https://d2ol7oe51mr4n9.cloudfront.net/user_3DwFIbiz6zkSYGJkFtQ3nlc5Uqo'
          curl -fL "$base/dd258ab7-0919-4902-9863-9a66545b7590.mp4" -o media/installation/enter.mp4
          curl -fL "$base/5665ca65-9b56-47fa-9bec-96e428a4cf3f.mp4" -o media/installation/many-presents.mp4
          curl -fL "$base/24854b7b-c007-4071-bdd6-58a02a05a2f6.mp4" -o media/installation/field.mp4
          curl -fL "$base/381c62ab-0286-4ac9-a70a-43a5cf926b1a.mp4" -o media/installation/duration.mp4
          curl -fL "$base/94420df9-467c-40fd-aefc-02226bc60bd6.mp4" -o media/installation/science.mp4
          curl -fL "$base/07151e4d-98d4-412a-86ec-d600f4b10144.mp4" -o media/installation/film-world.mp4
          curl -fL "$base/03c123aa-5ad6-4577-8cee-aa262ad844d5.mp4" -o media/installation/site-response.mp4
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('installation/index.html')
          s=p.read_text()

          # Replace all installation background sources with stable self-hosted files.
          urls=re.findall(r'<video src="[^"]+" muted[^>]*></video>',s)
          repl=[
            '../media/video/d2.mp4',
            '../media/installation/enter.mp4',
            '../media/installation/many-presents.mp4',
            '../media/installation/field.mp4',
            '../media/installation/duration.mp4',
            '../media/installation/science.mp4',
            '../media/installation/film-world.mp4',
            '../media/installation/site-response.mp4',
          ]
          for old,new in zip(urls,repl):
              s=s.replace(old,f'<video src="{new}" muted autoplay loop playsinline preload="metadata"></video>',1)

          # Remove brittle runtime loader.
          s=re.sub(r'\n?<script id="immersiveVideoRefresh">.*?</script>\n?','\n',s,flags=re.S)
          # Remove external Three.js dependency; visualiser below is native canvas.
          s=re.sub(r'<script src="https://cdnjs.cloudflare.com/ajax/libs/three\.js/r128/three\.min\.js"></script>\s*','',s)

          start=s.find("<script>\n(()=>{\nconst canvas=document.getElementById('roomCanvas')")
          if start!=-1:
              end=s.find('</script>',start)
              native='''<script id="roomVisualiser">\n(function(){\nconst canvas=document.getElementById('roomCanvas'),host=document.getElementById('room');if(!canvas||!host)return;\nconst ctx=canvas.getContext('2d');let yaw=.12,zoom=1,drag=false,lastX=0,mode='calm',bones=false,ack=false,t0=performance.now();\nfunction size(){const d=Math.min(devicePixelRatio||1,2),w=host.clientWidth,h=host.clientHeight;canvas.width=w*d;canvas.height=h*d;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(d,0,0,d,0,0)}\nfunction proj(x,y,z,w,h){const c=Math.cos(yaw),s=Math.sin(yaw),xx=x*c-z*s,zz=x*s+z*c+9/zoom,f=520/Math.max(1.2,zz);return [w/2+xx*f,h*.60-y*f,f]}\nfunction line(a,b,w,h,alpha){const A=proj(...a,w,h),B=proj(...b,w,h);ctx.strokeStyle='rgba(207,230,239,'+alpha+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke()}\nfunction drawRoom(w,h,t){ctx.fillStyle='#030509';ctx.fillRect(0,0,w,h);const pulse=.5+.5*Math.sin(t*(mode==='compression'?.009:.0014));\nconst floor=[[-7,0,-4],[7,0,-4],[7,0,5],[-7,0,5]];for(let i=0;i<4;i++)line(floor[i],floor[(i+1)%4],w,h,.22);\nfor(let x=-6;x<=6;x+=2){line([x,0,-4],[x,0,5],w,h,.08)}for(let z=-4;z<=5;z+=1.5){line([-7,0,z],[7,0,z],w,h,.06)}\nconst walls=[[-7,0,5,-7,6,5],[7,0,5,7,6,5],[-7,6,5,7,6,5],[-7,0,5,7,0,5],[-7,0,-4,-7,6,5],[7,0,-4,7,6,5]];walls.forEach(q=>line([q[0],q[1],q[2]],[q[3],q[4],q[5]],w,h,.18));\nconst screens=[[-5.2,1,4.85,-2.4,5.2,4.85],[-1.6,.6,4.82,1.6,5.45,4.82],[2.4,1,4.85,5.2,5.2,4.85]];screens.forEach((q,i)=>{const A=proj(q[0],q[1],q[2],w,h),B=proj(q[3],q[4],q[5],w,h);ctx.fillStyle=bones?'rgba(207,230,239,.05)':'rgba(190,215,225,'+(.13+.12*pulse)+')';ctx.fillRect(Math.min(A[0],B[0]),Math.min(A[1],B[1]),Math.abs(B[0]-A[0]),Math.abs(B[1]-A[1]));ctx.strokeStyle='rgba(207,230,239,.45)';ctx.strokeRect(Math.min(A[0],B[0]),Math.min(A[1],B[1]),Math.abs(B[0]-A[0]),Math.abs(B[1]-A[1]));});\nfor(let i=0;i<18;i++){const a=i/18*Math.PI*2,r=2.3+(i%5)*.42,P=proj(Math.cos(a)*r,.72,Math.sin(a)*r,w,h);ctx.fillStyle='rgba(8,10,13,.95)';ctx.beginPath();ctx.ellipse(P[0],P[1],Math.max(2,P[2]*.09),Math.max(5,P[2]*.32),0,0,Math.PI*2);ctx.fill()}\nconst C=proj(0,1.2,0,w,h);ctx.shadowBlur=mode==='compression'?32:18;ctx.shadowColor='rgba(207,230,239,.8)';ctx.fillStyle='rgba(220,238,245,.7)';ctx.beginPath();ctx.arc(C[0],C[1],Math.max(5,C[2]*.14),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;\nif(mode==='compression'&&Math.sin(t*.02)>.84){ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(0,0,w,h)}\n}\nfunction frame(ts){const w=host.clientWidth,h=host.clientHeight;drawRoom(w,h,ts-t0);requestAnimationFrame(frame)}\nsize();addEventListener('resize',size);canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lastX)*.004;lastX=e.clientX});canvas.addEventListener('pointerup',()=>drag=false);\nconst phase=document.getElementById('roomPhase'),calm=document.getElementById('calmBtn'),strobe=document.getElementById('strobeBtn'),show=document.getElementById('showBtn'),bonesBtn=document.getElementById('bonesBtn'),warn=document.getElementById('warn');\nfunction state(m){mode=m;calm.classList.toggle('on',m==='calm');strobe.classList.toggle('on',m==='compression');phase.textContent=m==='calm'?'calm field':'compression / pulse'}\ncalm.onclick=()=>state('calm');strobe.onclick=()=>ack?state('compression'):warn.classList.add('show');document.getElementById('continue').onclick=()=>{ack=true;warn.classList.remove('show');state('compression')};document.getElementById('cancel').onclick=()=>warn.classList.remove('show');show.onclick=()=>{bones=false;show.classList.add('on');bonesBtn.classList.remove('on')};bonesBtn.onclick=()=>{bones=true;show.classList.remove('on');bonesBtn.classList.add('on')};document.getElementById('zin').onclick=()=>zoom=Math.min(1.8,zoom*1.15);document.getElementById('zout').onclick=()=>zoom=Math.max(.65,zoom/1.15);requestAnimationFrame(frame);\n})();\n</script>'''
              s=s[:start]+native+s[end+9:]
          p.write_text(s)
          PY

          git config user.name "ChatGPT Site Update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installation/index.html media/installation
          git commit -m "Repair immersive visualiser and self-host videos"
          git push
