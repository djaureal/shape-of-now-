name: Enable stage film playback
on:
  push:
    paths:
      - '.github/workflows/enable-stage-film-playback-trigger'
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Make three film fragments playable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('stage/index.html')
          s=p.read_text()
          s=s.replace('.film img{width:100%;aspect-ratio:16/9;object-fit:cover;border:1px solid var(--l)}', '.film img,.film video{width:100%;aspect-ratio:16/9;object-fit:cover;border:1px solid var(--l);display:block;background:#000}')
          old='<div class="films"><div class="film"><img src="../media/video/hls/we_measure/poster.jpg"><h3>We Measure</h3></div><div class="film"><img src="../media/video/hls/youre_the_wave/poster.jpg"><h3>You\'re the Wave</h3></div><div class="film"><img src="../media/video/hls/beyond_the_end/poster.jpg"><h3>Beyond the End</h3></div></div>'
          new='<div class="films"><div class="film"><video class="film-player" controls playsinline preload="none" poster="../media/video/hls/we_measure/poster.jpg" data-hls="../media/video/hls/we_measure/index.m3u8"></video><h3>We Measure</h3></div><div class="film"><video class="film-player" controls playsinline preload="none" poster="../media/video/hls/youre_the_wave/poster.jpg" data-hls="../media/video/hls/youre_the_wave/index.m3u8"></video><h3>You\'re the Wave</h3></div><div class="film"><video class="film-player" controls playsinline preload="none" poster="../media/video/hls/beyond_the_end/poster.jpg" data-hls="../media/video/hls/beyond_the_end/index.m3u8"></video><h3>Beyond the End</h3></div></div>'
          if old not in s: raise SystemExit('film block not found')
          s=s.replace(old,new)
          marker='<script>const T='
          playback='''<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script><script id="filmPlayback">document.querySelectorAll('.film-player').forEach(function(v){var src=v.dataset.hls;if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=src}else if(window.Hls&&Hls.isSupported()){var h=new Hls({enableWorker:true});h.loadSource(src);h.attachMedia(v);v._hls=h}else{v.insertAdjacentHTML('afterend','<p style="font:9px var(--mo);color:var(--d);margin-top:8px">Video playback is not supported in this browser.</p>')}});</script>'''
          if marker not in s: raise SystemExit('script marker not found')
          s=s.replace(marker,playback+marker,1)
          p.write_text(s)
          PY
          git config user.name 'ChatGPT Site Update'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stage/index.html
          git commit -m 'Make stage film fragments playable'
          git push
