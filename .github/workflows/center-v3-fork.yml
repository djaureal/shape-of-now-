name: Center V3 fork panels
on:
  push:
    paths:
      - '.github/workflows/center-v3-fork-trigger'
jobs:
  refine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resize and center V3 fork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('V3/index.html')
          s=p.read_text()
          reps={
          '.fork-pair{display:grid;grid-template-columns:minmax(0,1fr) 76px minmax(0,1fr);align-items:stretch;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}':'.fork-pair{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);align-items:stretch;width:min(1420px,88vw);margin:0 auto clamp(30px,4vh,52px);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}',
          '.threshold-door{position:relative;min-height:clamp(540px,66svh,760px);display:flex;align-items:flex-end;text-decoration:none;color:inherit;overflow:hidden}':'.threshold-door{position:relative;min-height:clamp(430px,52svh,620px);display:flex;align-items:center;text-decoration:none;color:inherit;overflow:hidden}',
          '.door-content{position:relative;z-index:2;width:100%;padding:clamp(46px,7vh,74px) clamp(28px,4.3vw,70px)}':'.door-content{position:relative;z-index:2;width:100%;height:100%;padding:clamp(34px,5vh,56px) clamp(26px,3vw,48px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}',
          '.door-grid{display:block}':'.door-grid{display:block;width:min(500px,88%);margin:0 auto}',
          '.door-grid h3{font-family:var(--serif);font-weight:300;font-size:clamp(48px,5.7vw,86px);line-height:.84;letter-spacing:-.015em;margin-bottom:32px}':'.door-grid h3{font-family:var(--serif);font-weight:300;font-size:clamp(46px,4.6vw,74px);line-height:.86;letter-spacing:-.015em;margin-bottom:26px}',
          '.door-copy{max-width:43ch;font-size:clamp(13.5px,1.05vw,15.5px);line-height:1.76;color:var(--ink)}':'.door-copy{max-width:40ch;margin:0 auto;font-size:clamp(13.5px,1.02vw,15px);line-height:1.72;color:var(--ink)}',
          '@media(max-width:820px){.fork-pair{grid-template-columns:1fr;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}.threshold-door{min-height:580px}':'@media(max-width:820px){.fork-pair{grid-template-columns:1fr;width:min(92vw,620px);margin:0 auto clamp(28px,4vh,46px);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}.threshold-door{min-height:520px}'
          }
          for old,new in reps.items():
              if old not in s:
                  raise SystemExit('Missing CSS target: '+old[:90])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'ChatGPT Site Update'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V3/index.html
          git commit -m 'Resize and center V3 fork panels'
          git push
