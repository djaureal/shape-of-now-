name: Update memory and imagination opening
on:
  push:
    paths:
      - '.github/workflows/update-memory-imagination-trigger'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply update
        run: python3 scripts/update_memory_imagination.py
      - name: Commit changes
        run: |
          git config user.name 'ChatGPT Site Update'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V3/index.html index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Rewrite opening as Memory and Imagination'
          git push
