name: Refine V3 side-by-side fork
on:
  push:
    paths:
      - '.github/workflows/refine-v3-side-by-side-fork-trigger'
jobs:
  refine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply side-by-side fork
        run: python3 scripts/refine_v3_side_by_side_fork.py
      - name: Commit V3 fork refinement
        run: |
          git config user.name 'ChatGPT Site Update'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V3/index.html
          git commit -m 'Place V3 fork side by side' || exit 0
          git push
