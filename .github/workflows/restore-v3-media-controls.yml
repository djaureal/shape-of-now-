name: Restore V3 media controls
on:
  push:
    paths:
      - '.github/workflows/restore-v3-media-controls-trigger'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore full media controls
        run: python3 tools/patch_v3_media_controls.py
      - name: Commit changes
        run: |
          git config user.name 'ChatGPT Site Update'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V3/stage/index.html
          git diff --cached --quiet || git commit -m 'Restore full V3 media controls'
          git push
