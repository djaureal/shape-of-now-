name: Enable installation film playback

on:
  push:
    paths:
      - 'docs/.installation-film-playback-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update moving image players
        run: python3 scripts/update_installation_films.py
      - name: Commit changes
        run: |
          git config user.name "ChatGPT Site Update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installation/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Enable moving image playback and fullscreen"
            git push
          fi
